# .vortex.yml — Vortex API Guardian Workspace Configuration
# Documentation: https://github.com/lemon4ksan/aoni

version: 1
defaults:
  casing: snake_case
  engine: fast

lint:
  strict: false
  disable:
    - "E001"
  borrow:
    enabled: true
    include:
      - "internal/compress"
      - "internal/fast"
      - "internal/quic"
      - "fast"
      - "fluent"
      - "request"

contracts:
  - name: 001API
    file: internal/001/api.go

