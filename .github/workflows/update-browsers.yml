name: Update Browser Versions

on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (show changes without creating PR)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Security Vulnerability Scan (govulncheck)
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

      - name: Run update script
        id: update
        run: |
          chmod +x scripts/update-browser-versions.sh
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            bash scripts/update-browser-versions.sh --dry-run
          else
            bash scripts/update-browser-versions.sh
          fi

      - name: Create Pull Request
        if: steps.update.outputs.updated == 'true' && inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update browser profile versions"
          branch: auto/update-browser-versions
          delete-branch: true
          title: "chore: update browser profiles to Chrome ${{ steps.update.outputs.chrome_version }} / Firefox ${{ steps.update.outputs.firefox_version }}"
          body: |
            Automated update of browser impersonation profiles.

            ## Updated versions
            | Component | Platform | Version |
            |-----------|----------|---------|
            | Chrome | Windows | `${{ steps.update.outputs.chrome_win_version }}` |
            | Chrome | Android | `${{ steps.update.outputs.chrome_android_version }}` |
            | Chrome | iOS | `${{ steps.update.outputs.chrome_ios_version }}` |
            | Firefox | all | `${{ steps.update.outputs.firefox_version }}` |
            | iOS OS | Chrome + Firefox UA | `${{ steps.update.outputs.ios_version }}` |
            | Android OS | Firefox UA | `${{ steps.update.outputs.android_version }}` |
            | utls | — | `${{ steps.update.outputs.utls_version }}` |

            ## Live Canary Test Result
            - **Target**: `https://tls.peet.ws/api/all`
            - **Status**: PASSED ✅ (Wire TLS JA4 & HTTP/2 Akamai Fingerprint verified)

            ## TLS ClientHello spec comparison
            <details>
            <summary>compare-tls-spec output (click to expand)</summary>

            ```
            ${{ steps.update.outputs.spec_diff_output }}
            ```

            </details>

            ${{ steps.update.outputs.spec_drift == 'true' && '## ⚠️ Manual review required

            The TLS ClientHello spec has drifted from `utls.HelloChrome_Auto` / `utls.HelloFirefox_Auto`.
            Cipher suites, extensions, or key share groups have changed in the new utls version.

            **Before merging**, update `HelloChromeXXX` / `HelloFirefoxXXX` in `fingerprint/profiles/chrome/chrome.go`
            and `fingerprint/profiles/firefox/firefox.go` to match the reference spec shown above.' || '_TLS specs are in sync with utls auto — no manual review needed._' }}

            ---
            *This PR was automatically generated by the browser version update workflow.*
          labels: automated
