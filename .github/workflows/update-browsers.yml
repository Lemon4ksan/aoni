name: Update Browser Versions

on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (show changes without creating PR)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Security Vulnerability Scan (govulncheck)
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

      - name: Run update script
        id: update
        run: |
          chmod +x scripts/update-browser-versions.sh
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            bash scripts/update-browser-versions.sh --dry-run
          else
            bash scripts/update-browser-versions.sh
          fi

      - name: Prepare PR Body
        if: steps.update.outputs.updated == 'true' && inputs.dry_run != 'true'
        run: |
          {
            echo "Automated update of browser impersonation profiles."
            echo ""
            echo "## Updated versions"
            echo "| Component | Platform | Version |"
            echo "|-----------|----------|---------|"
            echo "| Chrome | Windows | \`${{ steps.update.outputs.chrome_win_version }}\` |"
            echo "| Chrome | Android | \`${{ steps.update.outputs.chrome_android_version }}\` |"
            echo "| Chrome | iOS | \`${{ steps.update.outputs.chrome_ios_version }}\` |"
            echo "| Firefox | all | \`${{ steps.update.outputs.firefox_version }}\` |"
            echo "| Safari | macOS / iOS | \`${{ steps.update.outputs.safari_version }}\` |"
            echo "| iOS OS | Chrome + Firefox + Safari UA | \`${{ steps.update.outputs.ios_version }}\` |"
            echo "| Android OS | Firefox UA | \`${{ steps.update.outputs.android_version }}\` |"
            echo "| utls | — | \`${{ steps.update.outputs.utls_version }}\` |"
            echo ""
            echo "## Live Canary Test Result"
            echo "- **Target**: \`https://tls.peet.ws/api/all\`"
            echo "- **Status**: PASSED ✅ (Wire TLS JA4 & HTTP/2 Akamai Fingerprint verified)"
            echo ""
            echo "## TLS ClientHello spec comparison"
            echo "<details>"
            echo "<summary>compare-tls-spec output (click to expand)</summary>"
            echo ""
            echo "\`\`\`"
            echo "${{ steps.update.outputs.spec_diff_output }}"
            echo "\`\`\`"
            echo ""
            echo "</details>"
            echo ""
            if [ "${{ steps.update.outputs.spec_drift }}" = "true" ]; then
              echo "## ⚠️ Manual review required"
              echo ""
              echo "The TLS ClientHello spec has drifted from \`utls.HelloChrome_Auto\` / \`utls.HelloFirefox_Auto\` / \`utls.HelloSafari_Auto\`."
              echo "Cipher suites, extensions, or key share groups have changed in the new utls version."
              echo ""
              echo "**Before merging**, update \`HelloChromeXXX\` / \`HelloFirefoxXXX\` in \`fingerprint/profiles/chrome/chrome.go\`,"
              echo "\`fingerprint/profiles/firefox/firefox.go\`, and \`fingerprint/profiles/safari/safari.go\` to match the reference spec shown above."
            else
              echo "_TLS specs are in sync with utls auto — no manual review needed._"
            fi
            echo ""
            echo "---"
            echo "*This PR was automatically generated by the browser version update workflow.*"
          } > pr_body.md

      - name: Create Pull Request
        if: steps.update.outputs.updated == 'true' && inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update browser profile versions"
          branch: auto/update-browser-versions
          delete-branch: true
          title: "chore: update browser profiles to Chrome ${{ steps.update.outputs.chrome_version }} / Firefox ${{ steps.update.outputs.firefox_version }} / Safari ${{ steps.update.outputs.safari_version }}"
          body-path: pr_body.md
          labels: automated
