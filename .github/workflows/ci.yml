name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Code Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=5m

      - name: Check TLS ClientHello Spec Drift
        run: go run ./scripts/compare-tls-spec/

  test-matrix:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run Tests with Race Detector
        run: go test -race -timeout 90s ./...

      - name: Run Benchmarks (smoke check)
        run: go test -bench=. -benchtime=1x -benchmem ./...

      - name: Generate coverage report
        if: matrix.os == 'ubuntu-latest'
        run: go test -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  wasm-build:
    name: WebAssembly Build Matrix (WASI & JS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Compile for WASI (wasip1/wasm)
        env:
          GOOS: wasip1
          GOARCH: wasm
        run: |
          go build . ./codec/... ./cookie/... ./fingerprint/... ./fast/... ./fluent/... ./mod/... ./netutil/... ./option/... ./realtime/... ./resiliency/... ./webpush/... ./internal/fast/... ./internal/quic/...

      - name: Compile for Web JS (js/wasm)
        env:
          GOOS: js
          GOARCH: wasm
        run: |
          go build . ./codec/... ./cookie/... ./fingerprint/... ./fast/... ./fluent/... ./mod/... ./netutil/... ./option/... ./realtime/... ./resiliency/... ./webpush/... ./internal/fast/... ./internal/quic/...

  fuzz-heavy:
    name: Wire Security Fuzzing (curl-level 55 targets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run Automated Heavy Fuzzing Suite
        run: go run ./scripts/fuzz_all.go -fuzztime=3s
